name: bench

on:
  # pull_request: disabled — the self-hosted benchmark runner is down, so every PR queued a
  # job that never got picked up. Restore this line once the runner is back.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# One run per PR; cancel superseded runs.
concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The definitive golden set (golden_bench_test.go) and the run flags. -count gives benchstat
  # several samples per benchmark so it can judge significance; -benchtime bounds wall time.
  BENCH: '^BenchmarkGolden$'
  FLAGS: '-run=^$ -benchmem -benchtime=300ms -count=6 -timeout=30m'

jobs:
  golden:
    runs-on: [Linux]
    # Serialize against every other benchmark job in the repo (including query-bench, which shares
    # this group): they share one self-hosted runner, and a concurrent run makes the numbers noise.
    # No cancel-in-progress here — later runs queue rather than kill a measurement in flight.
    #
    # queue: max, because the default (`single`) holds exactly ONE job pending per group and cancels
    # whichever was waiting before: with a measurement running and two PRs behind it, the older
    # waiter is cancelled rather than run, and that PR simply never gets its benchmark. `max` queues
    # up to 100 in FIFO order instead.
    concurrency:
      group: bench-runner
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit to benchmark it too

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Build the report generator from THIS PR's code now (before the tree is switched to the base
      # commit, which may not have the tool) and stash the binary outside the repo.
      - name: Build report tool
        run: go build -o "${RUNNER_TEMP}/benchreport" ./internal/cmd/benchreport

      - name: Benchmark PR head
        run: |
          set -o pipefail # else `go test | tee` reports tee's status and a failed run looks green
          go test ${FLAGS} -bench "${BENCH}" ./ | tee head.txt
          # A -bench pattern that matches nothing exits 0 in milliseconds. Without this the job is
          # green, the report renders its empty-results caution, and the gate measures nothing.
          grep -q '^Benchmark' head.txt \
            || { echo "::error::no benchmarks matched ${BENCH}"; exit 1; }

      # Run the SAME golden benchmark file against the base commit's library code, by copying this
      # PR's golden_bench_test.go onto a checkout of the base SHA. The golden set is self-contained,
      # so it compiles standalone. Non-fatal: if the base can't build the set, we show head only.
      - name: Benchmark base
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -o pipefail
          cp golden_bench_test.go "${RUNNER_TEMP}/golden_bench_test.go"
          git checkout --quiet --force ${{ github.event.pull_request.base.sha }}
          cp "${RUNNER_TEMP}/golden_bench_test.go" golden_bench_test.go
          go test ${FLAGS} -bench "${BENCH}" ./ | tee base.txt
          # Drop a result-less base so the report falls back to head-only rather than diffing a file
          # that holds only the goos/goarch preamble (which is non-empty, so -s would pass).
          grep -q '^Benchmark' base.txt || rm -f base.txt

      - name: Build report
        run: |
          if [ -f base.txt ]; then
            benchstat -format csv base.txt head.txt > bench.csv
            benchstat base.txt head.txt > bench.txt
          else
            benchstat -format csv head.txt > bench.csv
            benchstat head.txt > bench.txt
          fi
          "${RUNNER_TEMP}/benchreport" -raw bench.txt < bench.csv > report.md
          cat report.md

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: golden-bench
          path: |
            head.txt
            base.txt
            bench.csv
            bench.txt
            report.md
          if-no-files-found: warn

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- golden-bench -->';
            const body = fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
